
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#080b1c">
<title>@cricmatchstream</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
 width:100%;
 min-height:100%;
 background:#080b1c;
 color:white;
 font-family:Arial,sans-serif;
}

body{
 overflow-x:hidden;
 padding:18px 0 30px;
}

.wrapper{
 width:100%;
 max-width:850px;
 margin:auto;
 padding:0 15px;
}

/* TELEGRAM HEADER */
.telegram-header{
 height:82px;
 width:100%;
 border-radius:14px;
 background:linear-gradient(110deg,#5044ed,#a51be9);
 display:flex;
 justify-content:center;
 align-items:center;
 gap:13px;
 color:white;
 text-decoration:none;
 font-size:25px;
 font-weight:800;
 margin-bottom:25px;
}

.telegram-header i{font-size:27px}

/* VIDEO PLAYER */
#player-container{
 position:relative;
 width:100%;
 aspect-ratio:16/9;
 background:#000;
 overflow:hidden;
 border-radius:17px;
 box-shadow:0 8px 25px #0008;
 margin-bottom:27px;
}

video{
 width:100%;
 height:100%;
 object-fit:contain;
 background:#000;
}

#status{
 position:absolute;
 top:12px;
 right:12px;
 z-index:20;
 display:flex;
 align-items:center;
 gap:7px;
 padding:7px 12px;
 border-radius:20px;
 background:#111c;
 font-size:12px;
 opacity:0;
 pointer-events:none;
}

#status.show{opacity:1}
.st-dot{
 width:7px;
 height:7px;
 border-radius:50%;
 background:#60a5fa;
}
#status.live .st-dot{background:#22d3a0}
#status.warn .st-dot{background:#fb923c}
#status.err .st-dot{background:#f87171}

.shaka-controls-container button{color:white!important}
.shaka-video-container{background:#000!important}

.sp-fit-btn{
 background:transparent!important;
 border:none!important;
 padding:0 7px!important;
 color:white!important;
 cursor:pointer;
}
.fit-pill{
 font-size:10px;
 font-weight:bold;
 padding:4px 7px;
 border:1px solid #aaa;
 border-radius:4px;
 color:white;
}

/* FOLLOW SECTION */
.follow-box{
 border:2px solid #394357;
 border-radius:21px;
 padding:30px 24px 32px;
 background:#101b30;
 text-align:center;
 margin-bottom:26px;
}

.follow-title{
 color:#a6b4c9;
 font-size:24px;
 font-weight:800;
 margin-bottom:31px;
}

.join-button{
 display:flex;
 justify-content:center;
 align-items:center;
 gap:13px;
 width:100%;
 min-height:81px;
 padding:15px;
 border-radius:13px;
 background:linear-gradient(110deg,#5142ee,#a51ce9);
 color:white;
 text-decoration:none;
 font-size:23px;
 font-weight:800;
}

.join-button i{font-size:25px}

/* BALAJI POSTER */
.promo-link{
 display:block;
 width:100%;
 text-decoration:none;
 margin-bottom:20px;
}

.promo-link img{
 display:block;
 width:100%;
 height:auto;
 border-radius:18px;
}

/* SMALL WHATSAPP BUTTON */
.whatsapp-button{
 display:flex;
 align-items:center;
 justify-content:center;
 gap:9px;
 width:fit-content;
 max-width:100%;
 min-height:48px;
 padding:10px 20px;
 margin:0 auto 25px;
 border-radius:12px;
 background:#04cf61;
 color:white;
 font-size:16px;
 font-weight:700;
 text-decoration:none;
 text-align:center;
}

.whatsapp-button i{
 font-size:21px;
}

/* TELEGRAM POPUP */
.telegram-overlay{
 position:fixed;
 inset:0;
 z-index:99999;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 background:#000d;
 backdrop-filter:blur(6px);
}

.telegram-popup{
 width:100%;
 max-width:350px;
 padding:28px 22px;
 text-align:center;
 color:white;
 background:#111827;
 border:1px solid #263449;
 border-radius:18px;
 box-shadow:0 15px 50px #0009;
}

.telegram-icon{
 width:62px;
 height:62px;
 margin:0 auto 16px;
 display:flex;
 align-items:center;
 justify-content:center;
 border-radius:50%;
 background:#229ed9;
 font-size:30px;
}

.telegram-popup h2{margin-bottom:10px}

.telegram-popup p{
 margin-bottom:22px;
 color:#cbd5e1;
 font-size:14px;
 line-height:1.6;
}

.telegram-popup a,
.telegram-popup button{
 display:block;
 width:100%;
 padding:13px;
 border:0;
 border-radius:10px;
 font-size:15px;
 font-weight:bold;
 text-decoration:none;
 cursor:pointer;
}

.telegram-popup a{
 margin-bottom:10px;
 color:white;
 background:#229ed9;
}

.telegram-popup button{
 color:#e5e7eb;
 background:#273244;
}

.telegram-name{color:#38bdf8;font-weight:bold}

@media(max-width:480px){
 body{padding-top:18px}
 .telegram-header{height:82px;font-size:24px}
 .follow-box{padding:30px 18px 32px}
 .follow-title{font-size:23px}
 .join-button{font-size:20px;min-height:81px}
 .whatsapp-button{font-size:15px;padding:10px 16px}
}
</style>
</head>

<body>

<!-- TELEGRAM HEADER -->

<!-- TELEGRAM POPUP -->
<div id="telegramOverlay" class="telegram-overlay">

 <div class="telegram-popup">

  <div class="telegram-icon">
   <i class="fa-brands fa-telegram"></i>
  </div>

  <h2>Join Our Telegram</h2>

  <p>
   Join <span class="telegram-name">@cricmatchstream</span>
   for live links and updates.
  </p>

  <a href="https://t.me/cricmatchstream"
     target="_blank"
     rel="noopener noreferrer">
   JOIN CHANNEL
  </a>

  <button id="closePopup">
   ALREADY JOINED
  </button>

 </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>

<script>
(function(){
"use strict";

const CONFIG={
 streamUrl:"https://jiotvpllive.cdn.jio.com/bpk-tv/SonySportsTen3HinHDSTB_BTS/WDVLive/index.mpd",

 drmKeys:[
  "c20ba4e9d0635bab9f17b177f0d91039:fcb4a266539ac7b03ef02c5600c5598d",
  "c592c427c0d35e9a8ad88cdcb76a16c1:8ecb737e4015c22451d6c14fe37e9e15",
  "10f4930166fa5b6ab5d71a4a978bdfac:9dfa22aa4d6a3d820101f59013de0236",
  "140edf90fa0b5c99864f2442df4df535:991b51ed2e690c96163a31ae4a6f6452",
  "e392571e46bd5461854986ae9e58083d:1167c024aa8bbad2c1beaf218cfeec11"
 ],

 cookieUrl:"https://allrounder2-0.pages.dev/api/hindi.json"
};

const video=document.getElementById("video");
const container=document.getElementById("player-container");
const statusEl=document.getElementById("status");
const statusText=document.getElementById("statusText");

/* POPUP */
document.getElementById("closePopup").addEventListener("click",()=>{
 document.getElementById("telegramOverlay").style.display="none";
});

/* STATUS */
function setStatus(message,type,duration){
 statusText.textContent=message;
 statusEl.className="show "+(type||"live");

 if(setStatus.timer)clearTimeout(setStatus.timer);

 if(duration!==0){
  setStatus.timer=setTimeout(()=>{
   statusEl.classList.remove("show");
  },duration||4000);
 }
}

/* DRM KEYS */
function buildClearKeys(keys){
 const result={};

 keys.forEach(pair=>{
  const i=pair.indexOf(":");

  if(i>0){
   result[pair.slice(0,i).trim()]=pair.slice(i+1).trim();
  }
 });

 return result;
}

/* FIT / FILL / ZOOM */
function injectFitButton(){

 const panel=container.querySelector(".shaka-controls-button-panel");

 if(!panel||panel.querySelector(".sp-fit-btn"))return !!panel;

 const button=document.createElement("button");

 button.className="sp-fit-btn";
 button.title="Change video fit";
 button.innerHTML='<span class="fit-pill">FIT</span>';

 const modes=["contain","fill","cover"];
 const labels=["FIT","FILL","ZOOM"];
 let index=0;

 button.addEventListener("click",event=>{
  event.stopPropagation();

  index=(index+1)%modes.length;

  video.style.objectFit=modes[index];

  button.querySelector(".fit-pill").textContent=labels[index];
 });

 const fullscreen=panel.querySelector(".shaka-fullscreen-button");

 if(fullscreen)panel.insertBefore(button,fullscreen);
 else panel.appendChild(button);

 return true;
}

/* PLAYER INITIALIZATION */
async function initPlayer(){

 try{

  shaka.polyfill.installAll();

  if(!shaka.Player.isBrowserSupported()){
   setStatus("Browser Not Supported","err",0);
   return;
  }

  const player=new shaka.Player();

  await player.attach(video);

  const ui=new shaka.ui.Overlay(player,container,video);

  ui.configure({

   addBigPlayButton:true,

   controlPanelElements:[
    "play_pause",
    "mute",
    "time_and_duration",
    "spacer",
    "quality",
    "picture_in_picture",
    "fullscreen"
   ],

   seekBarColors:{
    base:"#828282",
    buffered:"#ffc336",
    played:"#1fc7ff"
   }

  });

  let attempts=0;

  const buttonTimer=setInterval(()=>{

   if(injectFitButton()||++attempts>=20){
    clearInterval(buttonTimer);
   }

  },150);

  player.configure({

   drm:{
    clearKeys:buildClearKeys(CONFIG.drmKeys)
   },

   manifest:{
    defaultPresentationDelay:5
   },

   streaming:{
    lowLatencyMode:true,
    bufferingGoal:10,
    rebufferingGoal:2,
    safeSeekOffset:5
   }

  });

  /* COOKIE FETCHING */
  let cookieValue="";

  try{

   const response=await fetch(CONFIG.cookieUrl,{
    cache:"no-store"
   });

   if(!response.ok)throw new Error("Cookie request failed");

   const data=await response.json();

   cookieValue=data.cookie||"";

  }catch(error){

   console.warn("Cookie request failed.");

  }

  /* COOKIE AND TOKEN REQUEST FILTER */
  if(cookieValue){

   player.getNetworkingEngine().registerRequestFilter((type,request)=>{

    request.headers=request.headers||{};

    request.headers["Cookie"]=cookieValue;

    const isMedia=
     type===shaka.net.NetworkingEngine.RequestType.MANIFEST||
     type===shaka.net.NetworkingEngine.RequestType.SEGMENT;

    if(isMedia&&request.uris&&request.uris[0]&&
       !request.uris[0].includes("__hdnea__")){

     const token=cookieValue.startsWith("__hdnea__=")
      ?cookieValue.slice(10)
      :cookieValue;

     request.uris[0]+=
      (request.uris[0].includes("?")?"&":"?")+
      "__hdnea__="+token;

    }

   });

  }

  /* PLAYER ERRORS */
  player.addEventListener("error",event=>{

   setStatus(
    "Stream error: "+(event.detail.code||""),
    "err",
    5000
   );

  });

  /* LOAD STREAM */
  setStatus("Loading…","warn",0);

  await player.load(CONFIG.streamUrl);

  setStatus("Live","live",4000);

  video.play().catch(()=>{});

  video.addEventListener("play",()=>{
   video.muted=false;
  });

  container.addEventListener("pointerdown",()=>{
   video.muted=false;
  },{once:true});

 }catch(error){

  console.error("Player initialization failed:",error);

  setStatus("Player initialization failed","err",0);

 }

}

if(document.readyState==="loading"){

 document.addEventListener("DOMContentLoaded",initPlayer);

}else{

 initPlayer();

}

})();
</script>

</body>
</html>
